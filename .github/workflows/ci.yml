name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install openai websockets jinja2
      - run: python -m py_compile siper_web.py
      - run: |
          for f in ai_agent/**/*.py; do
            python -m py_compile "$f"
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          for f in webui/js/*.js webui/js/**/*.js; do
            if [ -f "$f" ]; then
              node --check "$f" 2>&1 || exit 1
            fi
          done
